services:
  backend:
    build:
      context: ./Backend
    container_name: elemental-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_ENABLED: "true"
      DB_DIALECT: sqlite
      DB_USE_SQLITE: "true"
      DB_REQUIRE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-mi_clave_super_secreta}
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    volumes:
      # Base de datos SQLite persistida en el host (mismo archivo que usa el dev).
      - ./Backend/controllers/database.sqlite:/app/controllers/database.sqlite
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./Frontend
    container_name: elemental-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"