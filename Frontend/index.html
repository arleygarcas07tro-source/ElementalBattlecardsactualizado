<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Elemental Battlecards — juego de cartas estratégico basado en teoría de conjuntos." />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elemental Battlecards" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Elemental Battlecards</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color-scheme: dark;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        /* Asegura que el contenedor del juego y el formulario HTML se superpongan correctamente */
        /* Hacemos que el contenedor del juego ocupe toda la pantalla */
        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            outline: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }
        #game-container canvas {
            display: block;
            touch-action: manipulation;
        }
        #orientation-screen {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            box-sizing: border-box;
            background:
                radial-gradient(ellipse at 50% 35%, rgba(47, 69, 94, 0.62), transparent 58%),
                rgba(6, 9, 17, 0.97);
            color: #f2e9d3;
            text-align: center;
        }
        #orientation-screen .orientation-card {
            width: min(100%, 360px);
            padding: 28px 24px;
            border: 1px solid rgba(214, 180, 110, 0.5);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(20, 28, 42, 0.96), rgba(11, 15, 25, 0.98));
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55), inset 0 1px rgba(255, 255, 255, 0.06);
        }
        #orientation-screen .orientation-icon {
            width: 58px;
            height: 72px;
            margin: 0 auto 18px;
            color: #e8cf8f;
            animation: rotate-device 2.4s ease-in-out infinite;
        }
        #orientation-screen h1 {
            margin: 0 0 10px;
            font: 700 clamp(20px, 5vw, 26px)/1.2 Georgia, serif;
            letter-spacing: 0.03em;
        }
        #orientation-screen p {
            margin: 0;
            color: #bcc7d7;
            font: 15px/1.55 Georgia, serif;
        }
        @keyframes rotate-device {
            0%, 15% { transform: rotate(0deg); }
            55%, 85% { transform: rotate(90deg); }
            100% { transform: rotate(90deg); }
        }
        @media (orientation: portrait) and (max-width: 900px) {
            body.game-active #orientation-screen {
                display: flex;
            }
        }
        /* Pantalla de carga visible de inmediato mientras el bundle JS se descarga.
           #game-container la muestra y main.js la elimina cuando Phaser está listo. */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 40%, #3a2a4a 0%, #221a30 45%, #160f20 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            pointer-events: none;
        }
        #splash-screen .splash-title {
            color: #f2e9ff;
            font-size: clamp(20px, 6vw, 44px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
            margin: 0 0 18px;
        }
        #splash-screen .splash-spinner {
            width: clamp(34px, 8vw, 56px);
            height: clamp(34px, 8vw, 56px);
            border-radius: 50%;
            border: 4px solid rgba(242, 233, 255, 0.25);
            border-top-color: #f2e9ff;
            animation: splash-spin 0.9s linear infinite;
        }
        #splash-screen.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            #splash-screen .splash-spinner {
                animation-duration: 2.5s;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="splash-screen" aria-hidden="true">
            <p class="splash-title">Elemental Battlecards</p>
            <div class="splash-spinner"></div>
        </div>
    </div>
    <div id="orientation-screen" role="status" aria-live="polite">
        <div class="orientation-card">
            <svg class="orientation-icon" viewBox="0 0 58 72" fill="none" aria-hidden="true">
                <rect x="12" y="4" width="34" height="64" rx="7" stroke="currentColor" stroke-width="3" />
                <path d="M23 12h12M26 59h6" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                <path d="M4 23a27 27 0 0 1 43-11M54 49A27 27 0 0 1 11 60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                <path d="m43 7 5 5-7 2M15 66l-5-5 7-2" fill="currentColor" />
            </svg>
            <h1>Gira tu dispositivo</h1>
            <p>La arena se disfruta mejor en horizontal. Gira la pantalla para continuar la partida.</p>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>

</body>
</html>
