<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Elemental Battlecards — juego de cartas estratégico basado en teoría de conjuntos." />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elemental Battlecards" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Elemental Battlecards</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color-scheme: dark;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        /* Asegura que el contenedor del juego y el formulario HTML se superpongan correctamente */
        /* Hacemos que el contenedor del juego ocupe toda la pantalla */
        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            position: absolute;
            top: 0;
            left: 0;
            outline: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }
        #game-container canvas {
            display: block;
            touch-action: manipulation;
        }
        /* Pantalla de carga visible de inmediato mientras el bundle JS se descarga.
           #game-container la muestra y main.js la elimina cuando Phaser está listo. */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 40%, #3a2a4a 0%, #221a30 45%, #160f20 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            pointer-events: none;
        }
        #splash-screen .splash-title {
            color: #f2e9ff;
            font-size: clamp(20px, 6vw, 44px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
            margin: 0 0 18px;
        }
        #splash-screen .splash-spinner {
            width: clamp(34px, 8vw, 56px);
            height: clamp(34px, 8vw, 56px);
            border-radius: 50%;
            border: 4px solid rgba(242, 233, 255, 0.25);
            border-top-color: #f2e9ff;
            animation: splash-spin 0.9s linear infinite;
        }
        #splash-screen.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            #splash-screen .splash-spinner {
                animation-duration: 2.5s;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="splash-screen" aria-hidden="true">
            <p class="splash-title">Elemental Battlecards</p>
            <div class="splash-spinner"></div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>

</body>
</html>
