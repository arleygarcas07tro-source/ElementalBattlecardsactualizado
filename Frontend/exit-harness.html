<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Exit harness</title>
    <style>html, body { margin: 0; height: 100%; background: #111; }</style>
</head>
<body>
    <div id="game-container"></div>
    <script type="module">
        const errors = [];
        window.addEventListener('error', (e) => errors.push('error: ' + e.message));
        window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));
        const originalError = console.error.bind(console);
        console.error = (...args) => {
            errors.push('console.error: ' + args.map((a) => String(a)).join(' '));
            originalError(...args);
        };
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const waitFor = async (fn, timeout = 15000) => {
            const start = performance.now();
            while (performance.now() - start < timeout) {
                try { if (fn()) return true; } catch (e) { /* ignore */ }
                await wait(100);
            }
            return false;
        };

        import('./src/main.js').then(async () => {
            await waitFor(() => window.game && window.game.isBooted, 15000);
            await waitFor(() => window.game.scene.isActive('LoginScene'), 15000);

            const mode = new URLSearchParams(location.search).get('mode') || 'home';
            window.game.scene.getScenes(true).forEach((scene) => window.game.scene.stop(scene.scene.key));
            await wait(500);

            if (mode === 'home') {
                window.game.scene.start('HomeScenes', { playerData: { username: 'Invocador' } });
                await waitFor(() => window.game.scene.isActive('HomeScenes'), 5000);
                await wait(1000);
                const btn = document.querySelector('.btn-exit');
                if (!btn) errors.push('no se encontró .btn-exit');
                else btn.click();
                await wait(2000);
            } else if (mode === 'pause') {
                window.game.scene.start('PauseScene', { playerData: { username: 'Invocador' } });
                await waitFor(() => window.game.scene.isActive('PauseScene'), 5000);
                await wait(1000);
                const pauseScene = window.game.scene.getScene('PauseScene');
                let target = null;
                pauseScene.children.list.forEach((obj) => {
                    if (obj.list) {
                        const textObj = obj.list.find((child) => child.text && child.text.includes('SALIR'));
                        if (textObj) target = obj;
                    }
                });
                if (!target) errors.push('no se encontró el botón SALIR de PauseScene');
                else target.emit('pointerdown');
                await wait(2000);
            }

            const result = {
                mode,
                active: window.game.scene.getScenes(true).map((scene) => scene.scene.key),
                statuses: {},
                hasLoginDom: !!document.querySelector('.login-ui'),
                hasHomeDom: !!document.querySelector('.wrap'),
                loginActive: window.game.scene.isActive('LoginScene'),
                bodyText: document.body.innerText.slice(0, 300),
                errors
            };
            window.game.scene.scenes.forEach((scene) => {
                result.statuses[scene.scene.key] = scene.sys.settings.status;
            });
            const pre = document.createElement('pre');
            pre.id = 'result';
            pre.textContent = JSON.stringify(result, null, 2);
            document.body.appendChild(pre);
        }).catch((err) => {
            const pre = document.createElement('pre');
            pre.id = 'result';
            pre.textContent = JSON.stringify({ fatal: String(err), errors }, null, 2);
            document.body.appendChild(pre);
        });
    </script>
</body>
</html>
